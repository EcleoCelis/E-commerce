<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
    <nav class="text-xs text-[#776B56] mb-6 flex items-center gap-2" aria-label="Breadcrumb">
        <a href="#" onclick="app.navigate('home'); return false;" class="hover:underline inline-flex items-center min-h-[44px] sm:min-h-0">Home</a>
        <span aria-hidden="true">/</span>
        <span class="text-[#4E4638] font-semibold">Catalog</span>
    </nav>

    <div class="catalog-header flex flex-col md:flex-row justify-between items-start md:items-end mb-8 pb-6 border-b border-[#D7CEC1]">
        <div class="catalog-heading-group">
            <h1 class="font-serif text-3xl sm:text-4xl text-[#4E4638]">{{categoryName}}</h1>
            <p class="text-xs text-[#776B56] mt-1.5">{{productCountLabel}}</p>
        </div>
        <div class="catalog-sort-group mt-4 md:mt-0 flex items-center gap-3 w-full md:w-auto flex-shrink-0">
            <label for="catalog-sort-select" class="text-xs uppercase tracking-wider text-[#776B56] font-semibold whitespace-nowrap">Sort By:</label>
            <select id="catalog-sort-select" onchange="app.applyMarketplaceFilters({sortBy: this.value})" class="catalog-sort-select form-input py-1.5 text-xs w-full sm:w-48 min-h-[44px] sm:min-h-0">
                {{sortOptions}}
            </select>
        </div>
    </div>

    <form onsubmit="app.applyCatalogSearch(event)" class="mb-8 flex flex-col sm:flex-row gap-3 items-stretch">
        <div class="relative flex-1 min-w-0">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-[#776B56]">
                <svg class="w-4 h-4" aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            </div>
            <input name="q" type="search" value="{{searchQuery}}" placeholder="Search title, brand, material, or description..." class="form-input pl-10 h-11 text-sm" aria-label="Search catalog">
        </div>
        <button type="submit" class="btn-primary h-11 min-h-[44px] px-6 text-xs uppercase tracking-widest whitespace-nowrap">Search</button>
        {{clearSearchButton}}
    </form>

    <div class="grid grid-cols-1 lg:grid-cols-4 gap-8 items-start">
        <aside class="marketplace-filter-panel bg-white p-5 rounded-lg border border-[#D7CEC1]/70 shadow-subtle space-y-5" aria-label="Catalog filters">
            <div class="marketplace-filter-category">
                <h2 class="text-xs uppercase tracking-widest text-[#4E4638] font-bold mb-3">Category</h2>
                <ul class="marketplace-category-list space-y-1 text-xs">
                    {{categoryOptions}}
                </ul>
            </div>

            <div class="marketplace-filter-section pt-4 border-t border-[#D7CEC1]/50">
                <label for="catalog-max-price-range" class="block text-xs uppercase tracking-widest text-[#4E4638] font-bold mb-3">Maximum Price</label>
                <input id="catalog-max-price-range" type="range" min="0" max="{{catalogMaxPrice}}" step="500" value="{{priceMax}}" oninput="app.previewCatalogMaxPrice(this.value, {{catalogMaxPrice}})" onchange="app.applyMarketplaceFilters({priceMax: parseInt(this.value, 10) >= {{catalogMaxPrice}} ? null : parseInt(this.value, 10)})" class="w-full min-h-[44px] sm:min-h-0 accent-[#6E614D]">
                <div class="flex justify-between text-xs text-[#776B56] mt-1.5">
                    <span>{{priceMinLabel}}</span>
                    <span id="catalog-max-price-label" class="font-bold text-[#4E4638]">{{priceMaxLabel}}</span>
                </div>
            </div>

            <div class="marketplace-filter-section pt-4 border-t border-[#D7CEC1]/50">
                <label for="condition-filter" class="block text-xs uppercase tracking-widest text-[#4E4638] font-bold mb-3">Condition</label>
                <select id="condition-filter" onchange="app.applyMarketplaceFilters({condition: this.value})" class="form-input py-2 text-xs min-h-[44px] sm:min-h-0">
                    {{conditionOptions}}
                </select>
            </div>

            <div class="marketplace-filter-actions pt-2">
                <button type="button" onclick="app.resetMarketplaceFilters()" class="btn-outline w-full text-xs py-2.5 min-h-[44px]">Reset Filters</button>
            </div>
        </aside>

        <div class="lg:col-span-3 min-w-0">
            {{catalogStatus}}
            {{emptyState}}
            {{productGrid}}
        </div>
    </div>
</div>
