<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Sign In | SecondMarket</title>
    <link rel="stylesheet" href="/static/css/typography.css">
    <link rel="stylesheet" href="/static/css/auth.css">
</head>
<body class="auth-page admin-auth-page">
    <main class="auth-shell" aria-labelledby="admin-login-title">
        <div class="auth-top-bar">
            <a class="auth-brand" href="/admin/login.html">
                <span class="auth-brand-mark" aria-hidden="true"></span>
                SecondMarket Admin
            </a>
            <a class="auth-back-link" href="/">&larr; Back to Storefront</a>
        </div>

        <section class="auth-panel">
            <header class="auth-panel-header">
                <span class="auth-eyebrow">Seller Operations</span>
                <h1 id="admin-login-title">Admin Seller Sign In</h1>
                <p class="auth-subtitle">Access inventory, orders, fulfillment, and seller operations.</p>
            </header>

            <div data-auth-message class="auth-message" role="status" aria-live="polite"></div>

            <form data-auth-form="login" data-auth-required-role="admin" data-auth-success-url="/admin" class="auth-grid" novalidate>
                <div class="auth-field">
                    <label for="admin-login-email">Admin Email Address</label>
                    <input id="admin-login-email" name="email" type="email" required autocomplete="email" placeholder="admin@secondmarket.local" class="form-input">
                </div>
                <div class="auth-field">
                    <label for="admin-login-password">Password</label>
                    <input id="admin-login-password" name="password" type="password" required autocomplete="current-password" placeholder="Enter admin password" class="form-input">
                </div>
                <button type="submit" class="btn-primary">Sign In To Admin</button>
            </form>
        </section>
    </main>

    <script src="/static/js/auth-client.js"></script>
    <script src="/static/js/auth-page.js"></script>
</body>
</html>
