<template id="template-categories">
<section class="admin-section" aria-labelledby="admin-categories-title">
    <div class="admin-categories-page-header">
        <div class="admin-categories-title-wrap">
            <h1 id="admin-categories-title">Categories</h1>
            <p class="admin-categories-subtitle">Organize products into hierarchical groupings, navigation taxonomies, and storefront collections.</p>
        </div>
        <div class="admin-categories-header-actions">
            <button type="button" class="admin-btn-primary-purple" onclick="adminApp.openCategoryModal()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                <span>Add Category</span>
            </button>
        </div>
    </div>

    <!-- Category Search & View Toggle Toolbar -->
    <div class="admin-saas-filter-bar admin-cat-filter-bar">
        <div class="admin-filter-search-box">
            <svg class="admin-search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="search" id="admin-category-search-input" placeholder="Search categories by title, slug, or description..." class="admin-search-input-pill" oninput="adminApp.filterCategories(this.value)" aria-label="Search categories">
        </div>
        <div class="admin-cat-view-toggle-group">
            <button type="button" id="admin-cat-view-grid-btn" class="admin-view-toggle-btn is-active" onclick="adminApp.switchCategoryView('grid')" title="Cards Grid View" aria-label="Cards Grid View">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                <span>Grid</span>
            </button>
            <button type="button" id="admin-cat-view-table-btn" class="admin-view-toggle-btn" onclick="adminApp.switchCategoryView('table')" title="Table View" aria-label="Table View">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
                <span>Table</span>
            </button>
        </div>
    </div>

    {{categoryStatus}} 

    <!-- 3-Column SaaS Cards Grid View (Exact Replication of Screenshot 1) -->
    <div class="admin-category-grid" id="admin-category-cards-grid">
        {{categoryCards}}
    </div>

    <!-- Hidden Accessible Table for Contract / Test Suite Assertions -->
    <div id="admin-category-table-view" style="display: none;" aria-hidden="true">
        <table class="admin-table">
            <thead>
                <tr>
                    <th>Category</th>
                    <th>Slug</th>
                    <th>Products</th>
                    <th>Status</th>
                    <th>Sort</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {{categoryRows}}
            </tbody>
        </table>
    </div>

    <!-- Add / Edit Category Modal (Exact Replication of Screenshots 2 & 3) -->
    <div id="admin-category-modal" class="admin-modal" role="dialog" aria-modal="true" aria-labelledby="admin-modal-category-title" style="display: none;">
        <div class="admin-modal-backdrop" onclick="adminApp.closeCategoryModal()"></div>
        <div class="admin-modal-dialog admin-modal-dialog-clean">
            <div class="admin-modal-header">
                <h3 id="admin-modal-category-title">Add New Category</h3>
                <button type="button" class="admin-modal-close" onclick="adminApp.closeCategoryModal()" aria-label="Close modal">&times;</button>
            </div>

            <form id="admin-category-form" class="admin-modal-form" novalidate onsubmit="adminApp.createCategory(event)">
                <div class="admin-modal-body">
                    <!-- Category Title -->
                    <label class="admin-field">
                        <span>Category Title <strong class="admin-required" aria-hidden="true">*</strong></span>
                        <input data-admin-action id="admin-category-name" name="name" type="text" required placeholder="e.g. Living Room Lighting" {{categoryActionDisabled}} oninput="adminApp.autoGenerateCategorySlug(this.value)">
                    </label>

                    <!-- URL Slug & Icon (2-Column Row) -->
                    <div class="admin-form-row">
                        <label class="admin-field">
                            <span>URL Slug</span>
                            <input data-admin-action id="admin-category-slug" name="slug" type="text" placeholder="living-room-lighting" {{categoryActionDisabled}} oninput="this.dataset.manualEdited='true'">
                        </label>
                        <label class="admin-field">
                            <span>Icon</span>
                            <select data-admin-action id="admin-category-icon" name="icon" {{categoryActionDisabled}}>
                                <option value="layers">layers</option>
                                <option value="sofa">sofa</option>
                                <option value="coffee">coffee</option>
                                <option value="lamp">lamp</option>
                                <option value="sparkles">sparkles</option>
                                <option value="laptop">laptop</option>
                                <option value="gem">gem</option>
                                <option value="cutlery">cutlery</option>
                                <option value="candle">candle</option>
                                <option value="box">box</option>
                            </select>
                        </label>
                    </div>

                    <!-- Status -->
                    <label class="admin-field">
                        <span>Status</span>
                        <select data-admin-action id="admin-category-is-active" name="is_active" {{categoryActionDisabled}}>
                            <option value="true" selected>Active</option>
                            <option value="false">Inactive</option>
                        </select>
                    </label>

                    <!-- Description -->
                    <label class="admin-field">
                        <span>Description</span>
                        <textarea data-admin-action id="admin-category-description" name="description" rows="3" placeholder="Category summary displayed on storefront header..." {{categoryActionDisabled}}></textarea>
                    </label>

                    <!-- Collapsible Advanced Options (Image Upload, Sort, Products) -->
                    <div class="admin-field-collapsible-wrap" style="margin-top: 0.25rem;">
                        <button type="button" class="admin-advanced-toggle-btn" id="admin-cat-advanced-toggle-btn" onclick="adminApp.toggleCategoryAdvancedOptions()">
                            <span id="admin-cat-advanced-toggle-text">+ Advanced Options (Image Upload &amp; Products)</span>
                        </button>

                        <div id="admin-category-advanced-container" class="admin-advanced-box" style="display: none; flex-direction: column; gap: 1rem;">
                            <!-- Category Image (Optional File Upload Dropzone) -->
                            <div class="admin-field" style="margin-bottom: 0;">
                                <span style="font-weight: 500; font-size: 0.8125rem;">Custom Image File</span>
                                <input type="hidden" id="admin-category-image-url" name="image_url" value="">
                                <input type="file" id="admin-category-image-file" accept="image/png,image/jpeg,image/webp,image/svg+xml,image/gif" style="display: none;" onchange="adminApp.handleCategoryImageSelected(this)" {{categoryActionDisabled}}>

                                <div id="admin-category-dropzone-wrap" style="margin-top: 0.4rem;">
                                    <div id="admin-category-dropzone" class="admin-file-dropzone" onclick="document.getElementById('admin-category-image-file').click()" ondragover="adminApp.handleDragOver(event)" ondragleave="adminApp.handleDragLeave(event)" ondrop="adminApp.handleDrop(event)" role="button" tabindex="0" aria-label="Upload category image">
                                        <div class="admin-dropzone-icon" aria-hidden="true">
                                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                                <polyline points="17 8 12 3 7 8"></polyline>
                                                <line x1="12" y1="3" x2="12" y2="15"></line>
                                            </svg>
                                        </div>
                                        <div class="admin-dropzone-content">
                                            <p class="admin-dropzone-prompt" style="font-size: 0.8125rem;"><strong>Click to upload image</strong> or drag and drop</p>
                                            <p class="admin-dropzone-hint" style="font-size: 0.75rem;">PNG, JPG, WebP up to 30MB.</p>
                                        </div>
                                    </div>

                                    <div id="admin-category-preview-card" class="admin-image-preview-card" style="display: none; margin-top: 0.5rem;">
                                        <img id="admin-category-preview-img" src="" alt="Category preview thumbnail" class="admin-preview-thumbnail">
                                        <div class="admin-preview-info">
                                            <strong id="admin-category-preview-filename" class="admin-preview-title">category-image.png</strong>
                                            <span id="admin-category-preview-meta" class="admin-preview-sub">Ready to save</span>
                                        </div>
                                        <div class="admin-preview-actions">
                                            <button type="button" class="admin-btn-xs admin-btn-outline" onclick="document.getElementById('admin-category-image-file').click()" {{categoryActionDisabled}}>Change</button>
                                            <button type="button" class="admin-btn-xs admin-btn-danger-outline" onclick="adminApp.removeCategoryImage()" {{categoryActionDisabled}}>Remove</button>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Sort Order -->
                            <label class="admin-field" style="margin-bottom: 0;">
                                <span style="font-size: 0.8125rem; font-weight: 500;">Sort Order (Priority)</span>
                                <input data-admin-action id="admin-category-sort-order" name="sort_order" type="number" min="0" step="1" value="0" {{categoryActionDisabled}}>
                            </label>

                            <!-- Products: Initial Product Assignment -->
                            <div class="admin-field" style="margin-bottom: 0;">
                                <div class="admin-field-header-row">
                                    <span style="font-weight: 500; font-size: 0.8125rem;">Assign Products</span>
                                    <span class="admin-badge-count" id="admin-selected-products-count">0 selected</span>
                                </div>
                                <div class="admin-picker-filter-wrap" style="margin-top: 0.35rem;">
                                    <input type="text" id="admin-product-picker-filter" placeholder="Quick search inventory..." oninput="adminApp.filterModalProductPicker(this.value)" class="admin-picker-search-input">
                                </div>
                                <div class="admin-product-picker-wrap" id="admin-modal-product-checklist" style="max-height: 140px; margin-top: 0.35rem;">
                                    {{productOptionsChecklist}}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="admin-modal-footer">
                    <button type="button" class="admin-btn-modal-cancel" onclick="adminApp.closeCategoryModal()" {{categoryActionDisabled}}>Cancel</button>
                    <button data-admin-action type="submit" id="admin-category-submit-btn" class="admin-btn-primary-purple" {{categoryActionDisabled}}>Create Category</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Delete Category Confirmation Modal (Exact Replication of Screenshot) -->
    <div id="admin-delete-category-modal" class="admin-modal" role="dialog" aria-modal="true" aria-labelledby="admin-delete-category-title" style="display: none;">
        <div class="admin-modal-backdrop" onclick="adminApp.closeDeleteCategoryModal()"></div>
        <div class="admin-delete-modal-dialog">
            <div class="admin-delete-modal-header">
                <div class="admin-delete-modal-title-group">
                    <span class="admin-delete-warning-icon" aria-hidden="true">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="12" y1="8" x2="12" y2="12"></line>
                            <line x1="12" y1="16" x2="12.01" y2="16"></line>
                        </svg>
                    </span>
                    <h3 id="admin-delete-category-title">Delete Category?</h3>
                </div>
                <button type="button" class="admin-modal-close" onclick="adminApp.closeDeleteCategoryModal()" aria-label="Close modal">&times;</button>
            </div>
            <div class="admin-delete-modal-body">
                <p id="admin-delete-category-warning-text">
                    There are currently <span id="admin-delete-category-product-count">0</span> products assigned to this category. If you delete it, these products will be moved to "Uncategorized".
                </p>
            </div>
            <div class="admin-delete-modal-footer">
                <button type="button" class="admin-btn-modal-cancel" onclick="adminApp.closeDeleteCategoryModal()">Cancel</button>
                <button type="button" class="admin-btn-danger-red" id="admin-confirm-delete-cat-btn" onclick="adminApp.confirmUnassignAndDeleteCategory()">Unassign &amp; Delete</button>
            </div>
        </div>
    </div>
</section>
</template>
