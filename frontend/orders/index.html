<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders | SecondMarket</title>
    <link rel="stylesheet" href="/static/css/typography.css">
    <link rel="stylesheet" href="/static/css/orders/base.css">
</head>
<body class="orders-page">
    <header class="orders-header">
        <a href="/" class="orders-brand" aria-label="SecondMarket storefront">
            <span class="orders-brand-mark" aria-hidden="true"></span>
            <span>SecondMarket</span>
        </a>

        <nav class="orders-nav" aria-label="Order navigation">
            <button type="button" data-orders-nav="history" onclick="ordersApp.navigate('history')" class="orders-nav-link is-active">History</button>
            <a href="/checkout" class="orders-nav-link">Checkout</a>
            <a href="/" class="orders-nav-link">Storefront</a>
        </nav>

        <div class="orders-user" aria-live="polite">
            <span data-orders-user-name>Checking access...</span>
        </div>
    </header>

    <main id="orders-main-content" class="orders-main" tabindex="-1">
        <section class="orders-state-panel" aria-live="polite">
            <h1>Loading orders</h1>
            <p>Please wait while SecondMarket prepares your order history.</p>
        </section>
    </main>

    <div id="orders-toast-container" class="orders-toast-container" aria-live="polite"></div>

    <!-- Native HTML5 Templates (Zero-latency in-DOM template declarations) -->
    <template id="template-history">
        <section class="orders-section" aria-labelledby="orders-history-title">
            <div class="orders-section-header">
                <div>
                    <p class="orders-eyebrow">Buyer Orders</p>
                    <h1 id="orders-history-title">Order History</h1>
                </div>
                <button type="button" class="orders-secondary-button" onclick="ordersApp.refreshOrders()">Refresh</button>
            </div>

            <form class="orders-filter-bar" onsubmit="ordersApp.applyFilters(event)">
                <label class="orders-field">
                    <span>Status</span>
                    <select name="status">
                        {{statusOptions}}
                    </select>
                </label>
                <label class="orders-field">
                    <span>Payment</span>
                    <select name="payment_status">
                        {{paymentOptions}}
                    </select>
                </label>
                <label class="orders-field">
                    <span>Shipping</span>
                    <select name="shipping_status">
                        {{shippingOptions}}
                    </select>
                </label>
                <label class="orders-field">
                    <span>Sort</span>
                    <select name="sort">
                        {{sortOptions}}
                    </select>
                </label>
                <button type="submit" class="orders-primary-button">Apply</button>
            </form>

            {{ordersStatus}}

            <div class="orders-list" aria-live="polite">
                {{orderCards}}
            </div>
        </section>
    </template>

    <template id="template-detail">
        <section class="orders-section" aria-labelledby="orders-detail-title">
            <div class="orders-section-header">
                <div>
                    <p class="orders-eyebrow">Order Detail</p>
                    <h1 id="orders-detail-title">{{orderNumber}}</h1>
                </div>
                <button type="button" class="orders-secondary-button" onclick="ordersApp.navigate('history')">Back To History</button>
            </div>

            {{ordersStatus}}

            <div class="orders-detail-grid">
                <section class="orders-panel" aria-label="Order items">
                    <div class="orders-panel-header">
                        <h2>Items</h2>
                        <span>{{itemCount}} item(s)</span>
                    </div>
                    <div class="orders-item-list">
                        {{orderItems}}
                    </div>
                </section>

                <aside class="orders-summary-card" aria-label="Order summary">
                    <p class="orders-eyebrow">Summary</p>
                    <strong>{{orderTotal}}</strong>
                    <dl>
                        <div>
                            <dt>Status</dt>
                            <dd>{{orderStatus}}</dd>
                        </div>
                        <div>
                            <dt>Payment</dt>
                            <dd>{{paymentStatus}}</dd>
                        </div>
                        <div>
                            <dt>Shipping</dt>
                            <dd>{{shippingStatus}}</dd>
                        </div>
                        <div>
                            <dt>Placed</dt>
                            <dd>{{placedAt}}</dd>
                        </div>
                    </dl>
                    {{cancellationAction}}
                </aside>
            </div>

            {{paymentPanel}}

            {{trackingPanel}}

            {{returnSection}}

            <section class="orders-panel" aria-label="Shipping address">
                <div class="orders-panel-header">
                    <h2>Shipping</h2>
                </div>
                <div class="orders-address">
                    {{shippingAddress}}
                </div>
            </section>
        </section>
    </template>

    <script src="/static/js/auth-client.js"></script>
    <script src="/static/js/orders/orders-api.js"></script>
    <script src="/static/js/orders/pages/history-page.js"></script>
    <script src="/static/js/orders/pages/detail-page.js"></script>
    <script src="/static/js/orders/app.js"></script>
</body>
</html>
