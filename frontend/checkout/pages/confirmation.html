<template id="template-confirmation">
<section class="checkout-section checkout-confirmation-view" aria-labelledby="checkout-confirm-title">
    <div class="checkout-section-header">
        <div>
            <p class="checkout-eyebrow">Step 3 of 3 &bull; Confirmation</p>
            <h1 id="checkout-confirm-title">{{confirmationHeading}}</h1>
        </div>
        <div class="checkout-confirm-header-actions">
            <a href="/" class="checkout-secondary-link">Continue Shopping</a>
        </div>
    </div>

    {{confirmationBody}}
</section>
</template>
