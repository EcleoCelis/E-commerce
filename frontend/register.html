<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | SecondMarket</title>
    <link rel="stylesheet" href="/static/css/typography.css">
    <link rel="stylesheet" href="/static/css/auth.css">
</head>
<body class="auth-page">
    <main class="auth-shell auth-shell--wide" aria-labelledby="register-title">
        <div class="auth-top-bar">
            <a class="auth-brand" href="/">
                <span class="auth-brand-mark" aria-hidden="true"></span>
                SecondMarket
            </a>
            <a class="auth-back-link" href="/">&larr; Back to Storefront</a>
        </div>

        <section class="auth-panel">
            <header class="auth-panel-header">
                <span class="auth-eyebrow">New Buyer Account</span>
                <h1 id="register-title">Create Buyer Account</h1>
                <p class="auth-subtitle">Register as a buyer to save secondhand finds and prepare for checkout.</p>
            </header>

            <div data-auth-message class="auth-message" role="status" aria-live="polite"></div>

            <form data-auth-form="register" class="auth-grid" novalidate>
                <div class="auth-grid two-columns">
                    <div class="auth-field">
                        <label for="register-first-name">First Name</label>
                        <input id="register-first-name" name="first_name" type="text" required autocomplete="given-name" placeholder="Juan" class="form-input">
                    </div>
                    <div class="auth-field">
                        <label for="register-last-name">Last Name</label>
                        <input id="register-last-name" name="last_name" type="text" required autocomplete="family-name" placeholder="Dela Cruz" class="form-input">
                    </div>
                </div>
                <div class="auth-field">
                    <div class="auth-label-row">
                        <label for="register-phone">Phone Number</label>
                        <span class="auth-field-hint">Optional</span>
                    </div>
                    <input id="register-phone" name="phone" type="tel" autocomplete="tel" placeholder="+63 912 345 6789" class="form-input">
                </div>
                <div class="auth-field">
                    <label for="register-email">Email Address</label>
                    <input id="register-email" name="email" type="email" required autocomplete="email" placeholder="you@example.com" class="form-input">
                </div>
                <div class="auth-field">
                    <div class="auth-label-row">
                        <label for="register-password">Password</label>
                        <span class="auth-field-hint">At least 8 characters</span>
                    </div>
                    <div class="auth-password-wrap">
                        <input id="register-password" name="password" type="password" required autocomplete="new-password" minlength="8" placeholder="Create a secure password" class="form-input">
                        <button type="button" class="auth-password-toggle" data-password-toggle="register-password" aria-label="Show password" aria-pressed="false">Show</button>
                    </div>
                </div>
                <button type="submit" class="btn-primary">Create Buyer Account</button>
            </form>

            <footer class="auth-footer">
                <p class="auth-switch-prompt">
                    Have already an account?
                    <a class="auth-text-link" href="/login.html">Log in instead</a>
                </p>
            </footer>
        </section>
    </main>

    <script src="/static/js/auth-client.js"></script>
    <script src="/static/js/auth-page.js"></script>
</body>
</html>
